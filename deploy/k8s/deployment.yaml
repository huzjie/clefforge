apiVersion: apps/v1
kind: Deployment
metadata:
  name: clefforge
  labels:
    app: clefforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clefforge
  template:
    metadata:
      labels:
        app: clefforge
    spec:
      containers:
        - name: clefforge
          image: clefforge:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CLEFFORGE_BACKEND
              value: "mock"
            - name: CLEFFORGE_MODEL
              value: "clef-flash"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
